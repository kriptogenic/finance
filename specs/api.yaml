          items:
            $ref: '#/components/schemas/ScheduledTransaction'

    ScheduledTransaction:
      type: object
      additionalProperties: false
      description: A transaction template plus a recurrence rule and scheduling state.
      required:
        - id
        - type
        - amount
        - tags
        - frequency
        - interval
        - start_date
        - paused
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: Optional label for the schedule (e.g. "Rent").
        type:
          $ref: './definitions.yaml#/components/schemas/TransactionType'
        from_account_id:
          type: string
          format: uuid
          nullable: true
        to_account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        to_amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        rate_to_base:
          type: string
          nullable: true
          description: Frozen FX rate applied to each materialized run; present when currency != base.
        note:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        frequency:
          $ref: './definitions.yaml#/components/schemas/ScheduleFrequency'
        interval:
          type: integer
          minimum: 1
          description: Recur every N units of the frequency.
        start_date:
          type: string
          format: date
          description: Recurrence anchor; the first occurrence.
        end_date:
          type: string
          format: date
          nullable: true
          description: Last date an occurrence may fall on; no end when omitted.
        paused:
          type: boolean
          description: Excluded from the forecast while paused.
        created_at:
          type: string
          format: date-time

    CreateScheduledTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - frequency
        - start_date
      properties:
        name:
