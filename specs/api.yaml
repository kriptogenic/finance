        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Minor units, in the primary account's currency.
        to_amount:
          type: integer
          format: int64
          description: Required for cross-currency transfers; in the to account's currency.
        rate_to_base:
          type: string
          description: Required when the primary currency differs from base. Decimal string.
        note:
          type: string
        tags:
          type: array
          items:
            type: string
        frequency:
          $ref: './definitions.yaml#/components/schemas/ScheduleFrequency'
        interval:
          type: integer
          minimum: 1
          default: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        paused:
          type: boolean

