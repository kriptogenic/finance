openapi: "3.0.0"
info:
  version: 0.1.0
  title: Finance API
  license:
    name: private
paths:
  /health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: bad request
