openapi: "3.0.0"
info:
  version: 0.1.0
  title: Finance API
  license:
    name: private
paths:
  /health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts with derived balances
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: Accounts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
    post:
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        201:
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/BadRequest'

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAccount
      summary: Get an account with its derived balance
      responses:
        200:
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAccount
      summary: Update mutable account fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        200:
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAccount
      summary: Delete an account; only allowed when it has no transactions
      responses:
        204:
          description: Account deleted
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: Account is in use; archive it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    get:
      operationId: listCategories
      summary: List categories (expense and income trees)
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: './definitions.yaml#/components/schemas/CategoryType'
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      operationId: createCategory
      summary: Create a category or subcategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        201:
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        400:
          $ref: '#/components/responses/BadRequest'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      operationId: getCategory
      summary: Get a category
      responses:
        200:
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCategory
      summary: Update mutable category fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        200:
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategory
      summary: Delete a category; only allowed when it has no subcategories or transactions
      responses:
        204:
          description: Category deleted
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: Category is in use; archive it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions:
    get:
      operationId: listTransactions
      summary: List/search transactions
      parameters:
        - name: account_id
          in: query
          schema: { type: string, format: uuid }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            $ref: './definitions.yaml#/components/schemas/TransactionType'
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Free-text match on the note
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        200:
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
    post:
      operationId: createTransaction
      summary: Record an expense, income, or transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        201:
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/BadRequest'

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransaction
      summary: Get a transaction
      responses:
        200:
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        404:
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTransaction
      summary: Replace a transaction (full edit; re-validates and re-freezes the rate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        200:
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction
      responses:
        204:
          description: Transaction deleted
        404:
          $ref: '#/components/responses/NotFound'

  /reports/net-worth:
    get:
      operationId: getNetWorth
      summary: Net worth with assets/liabilities and per-currency exposure
      responses:
        200:
          description: Net worth report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorthReport'

  /reports/spending:
    get:
      operationId: getSpending
      summary: Spending by top-level category over a period (base currency)
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        200:
          description: Spending report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingReport'

  /reports/cash-flow:
    get:
      operationId: getCashFlow
      summary: Income vs expense per month (base currency)
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        200:
          description: Cash-flow report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowReport'

components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: bad request

    AccountListResponse:
      type: object
      additionalProperties: false
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - type
        - currency
        - opening_balance
        - balance
        - archived
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: './definitions.yaml#/components/schemas/AccountKind'
        type:
          $ref: './definitions.yaml#/components/schemas/AccountType'
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        opening_balance:
          type: integer
          format: int64
          description: Minor units, in the account's own currency.
        balance:
          $ref: './definitions.yaml#/components/schemas/Money'
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        # subtype fields, present only for the relevant type
        interest_rate:
          type: number
          nullable: true
        term_months:
          type: integer
          nullable: true
        maturity_date:
          type: string
          format: date
          nullable: true
        capitalization:
          type: boolean
          nullable: true
        credit_limit:
          type: integer
          format: int64
          nullable: true
        principal:
          type: integer
          format: int64
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        payment_day:
          type: integer
          nullable: true

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
        - type
        - currency
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: './definitions.yaml#/components/schemas/AccountKind'
        type:
          $ref: './definitions.yaml#/components/schemas/AccountType'
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        opening_balance:
          type: integer
          format: int64
          default: 0
        interest_rate:
          type: number
        term_months:
          type: integer
        maturity_date:
          type: string
          format: date
        capitalization:
          type: boolean
        credit_limit:
          type: integer
          format: int64
        principal:
          type: integer
          format: int64
        start_date:
          type: string
          format: date
        payment_day:
          type: integer

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        archived:
          type: boolean
        interest_rate:
          type: number
        term_months:
          type: integer
        maturity_date:
          type: string
          format: date
        capitalization:
          type: boolean
        credit_limit:
          type: integer
          format: int64
        principal:
          type: integer
          format: int64
        start_date:
          type: string
          format: date
        payment_day:
          type: integer

    CategoryListResponse:
      type: object
      additionalProperties: false
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - archived
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: './definitions.yaml#/components/schemas/CategoryType'
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: './definitions.yaml#/components/schemas/CategoryType'
        parent_id:
          type: string
          format: uuid
        icon:
          type: string
        color:
          type: string

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        icon:
          type: string
        color:
          type: string
        archived:
          type: boolean

    TransactionListResponse:
      type: object
      additionalProperties: false
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - date
        - type
        - amount
        - tags
        - created_at
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        type:
          $ref: './definitions.yaml#/components/schemas/TransactionType'
        from_account_id:
          type: string
          format: uuid
          nullable: true
        to_account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        to_amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        rate_to_base:
          type: string
          nullable: true
          description: Frozen FX rate at transaction time; present when currency != base.
        base_amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        note:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
      properties:
        date:
          type: string
          format: date-time
          description: Defaults to now when omitted.
        type:
          $ref: './definitions.yaml#/components/schemas/TransactionType'
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Minor units, in the primary account's currency.
        to_amount:
          type: integer
          format: int64
          description: Required for cross-currency transfers; in the to account's currency.
        rate_to_base:
          type: string
          description: Required when the primary currency differs from base. Decimal string.
        note:
          type: string
        tags:
          type: array
          items:
            type: string

    NetWorthReport:
      type: object
      additionalProperties: false
      required:
        - base
        - net_worth
        - assets
        - liabilities
        - by_currency
        - missing_rates
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        net_worth:
          $ref: './definitions.yaml#/components/schemas/Money'
        assets:
          $ref: './definitions.yaml#/components/schemas/Money'
        liabilities:
          $ref: './definitions.yaml#/components/schemas/Money'
        by_currency:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyExposure'
        missing_rates:
          type: array
          description: Currencies with no known rate, excluded from the base totals.
          items:
            $ref: './definitions.yaml#/components/schemas/Currency'

    CurrencyExposure:
      type: object
      additionalProperties: false
      required:
        - currency
        - assets
        - liabilities
        - net
        - rate_known
      properties:
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        assets:
          type: integer
          format: int64
          description: Minor units, in this currency.
        liabilities:
          type: integer
          format: int64
        net:
          type: integer
          format: int64
        rate_known:
          type: boolean
        net_in_base:
          $ref: './definitions.yaml#/components/schemas/Money'

    SpendingReport:
      type: object
      additionalProperties: false
      required:
        - base
        - total
        - categories
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        total:
          $ref: './definitions.yaml#/components/schemas/Money'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySpend'

    CategorySpend:
      type: object
      additionalProperties: false
      required:
        - category_id
        - category_name
        - amount
      properties:
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        amount:
          $ref: './definitions.yaml#/components/schemas/Money'

    CashFlowReport:
      type: object
      additionalProperties: false
      required:
        - base
        - months
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthFlow'

    MonthFlow:
      type: object
      additionalProperties: false
      required:
        - month
        - income
        - expense
        - net
      properties:
        month:
          type: string
          description: YYYY-MM
        income:
          $ref: './definitions.yaml#/components/schemas/Money'
        expense:
          $ref: './definitions.yaml#/components/schemas/Money'
        net:
          $ref: './definitions.yaml#/components/schemas/Money'
