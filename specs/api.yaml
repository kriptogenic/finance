openapi: "3.0.0"
info:
  version: 0.1.0
  title: Finance API
  license:
    name: private
security:
  - BasicAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      security: []  # No auth for the health probe
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /config:
    get:
      operationId: getConfig
      summary: Client-facing app configuration (base currency, validation thresholds)
      responses:
        200:
          description: App configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'

  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts with derived balances
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: Accounts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
    post:
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        201:
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/BadRequest'

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAccount
      summary: Get an account with its derived balance
      responses:
        200:
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAccount
      summary: Update mutable account fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        200:
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAccount
      summary: Delete an account; only allowed when it has no transactions
      responses:
        204:
          description: Account deleted
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: Account is in use; archive it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}/amortization:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAmortization
      summary: Amortization schedule for a loan account
      responses:
        200:
          description: Amortization schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmortizationSchedule'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getLoanSchedule
      summary: Stored repayment schedule for a loan account (generated on first read)
      responses:
        200:
          description: Loan repayment schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanScheduleResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    post:
      operationId: regenerateLoanSchedule
      summary: Rebuild the schedule from the loan's terms, keeping overrides and paid flags
      responses:
        200:
          description: Regenerated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanScheduleResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/schedule/{period}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: period
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateLoanScheduleRow
      summary: Override a due date or mark an installment paid, recomputing the tail forward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoanScheduleRow'
      responses:
        200:
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanScheduleResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      operationId: listCategories
      summary: List categories (expense and income trees)
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: './definitions.yaml#/components/schemas/CategoryType'
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      operationId: createCategory
      summary: Create a category or subcategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        201:
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        400:
          $ref: '#/components/responses/BadRequest'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      operationId: getCategory
      summary: Get a category
      responses:
        200:
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCategory
      summary: Update mutable category fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        200:
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategory
      summary: Delete a category; only allowed when it has no subcategories or transactions
      responses:
        204:
          description: Category deleted
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: Category is in use; archive it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/suggest-icons:
    post:
      operationId: suggestIcons
      summary: Suggest Tabler icon names for a category name, using an LLM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestIconsRequest'
      responses:
        200:
          description: >-
            Suggested icon names, most relevant first. Empty when suggestions
            are not configured or the upstream model is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestIconsResponse'
        400:
          $ref: '#/components/responses/BadRequest'

  /transactions:
    get:
      operationId: listTransactions
      summary: List/search transactions
      parameters:
        - name: account_id
          in: query
          schema: { type: string, format: uuid }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            $ref: './definitions.yaml#/components/schemas/TransactionType'
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
        - name: tag
          in: query
          schema: { type: string }
        - name: uncategorized
          in: query
          description: When true, return only transactions in the Uncategorized buckets.
          schema: { type: boolean }
        - name: q
          in: query
          description: Free-text match on the note
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        200:
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
    post:
      operationId: createTransaction
      summary: Record an expense, income, or transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        201:
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/BadRequest'

  /transactions/export:
    get:
      operationId: exportTransactions
      summary: Export expenses and income (matching the given filters) as an .xlsx file
      parameters:
        - name: account_id
          in: query
          schema: { type: string, format: uuid }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: Restrict to a single type; transfers are always excluded.
          schema:
            $ref: './definitions.yaml#/components/schemas/TransactionType'
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Free-text match on the note
          schema: { type: string }
      responses:
        200:
          description: Spreadsheet with datetime, amount, category name and note columns
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransaction
      summary: Get a transaction
      responses:
        200:
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        404:
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTransaction
      summary: Replace a transaction (full edit; re-validates and re-freezes the rate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        200:
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchTransaction
      summary: Partially update a transaction (currently only its category)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTransactionRequest'
      responses:
        200:
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction
      responses:
        204:
          description: Transaction deleted
        404:
          $ref: '#/components/responses/NotFound'

  /transactions/{id}/category-suggestions:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getCategorySuggestions
      summary: Suggest categories for a transaction (local rules, then an LLM)
      responses:
        200:
          description: >-
            Ranked category suggestions, most relevant first. Empty when nothing
            matches and suggestions are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuggestionsResponse'
        404:
          $ref: '#/components/responses/NotFound'

  /transactions/{id}/split:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransactionSplit
      summary: Get the split breakdown of an expense (your share + per-person owed)
      responses:
        200:
          description: Split breakdown (empty participants when not split)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSplit'
        404:
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setTransactionSplit
      summary: >-
        Split an expense across people. Your share stays the expense; each
        participant's share becomes a transfer into a new receivable account.
        An empty participant list un-splits the expense.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSplitRequest'
      responses:
        200:
          description: Updated split breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSplit'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /category-rule-blocks:
    get:
      operationId: listCategoryRuleBlocks
      summary: List merchants the user never wants to be offered a rule for
      responses:
        200:
          description: Blocked merchants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRuleBlockListResponse'
    post:
      operationId: createCategoryRuleBlock
      summary: Never offer a routing rule for this merchant again
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRuleBlockRequest'
      responses:
        201:
          description: Merchant blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRuleBlock'
        400:
          $ref: '#/components/responses/BadRequest'

  /ingest/transactions:
    post:
      operationId: ingestTransaction
      summary: Idempotently ingest an external transaction (e.g. bank notifications)
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestTransactionRequest'
      responses:
        201:
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        200:
          description: Already ingested (deduped by external_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

  /ingest/balances:
    post:
      operationId: ingestBalances
      summary: Ingest a card balance snapshot (e.g. the bot's periodic balance report)
      description: >-
        Upserts the latest reported balance per card (keyed by card_last4). Used
        for reconciliation against derived account balances. Idempotent.
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceSnapshotRequest'
      responses:
        204:
          description: Snapshot accepted
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

  /reconciliation:
    get:
      operationId: getReconciliation
      summary: Compare bank-reported card balances against derived account balances
      responses:
        200:
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'

  /reports/net-worth:
    get:
      operationId: getNetWorth
      summary: Net worth with assets/liabilities and per-currency exposure
      responses:
        200:
          description: Net worth report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorthReport'

  /reports/spending:
    get:
      operationId: getSpending
      summary: Spending by top-level category over a period (base currency)
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        200:
          description: Spending report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingReport'

  /reports/cash-flow:
    get:
      operationId: getCashFlow
      summary: Income vs expense per month (base currency)
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        200:
          description: Cash-flow report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowReport'

  /reports/forecast:
    get:
      operationId: getForecast
      summary: Projected income/expense/transfer cash flow for a month (base currency)
      parameters:
        - name: month
          in: query
          description: Target month as YYYY-MM. Defaults to the current month.
          schema: { type: string }
      responses:
        200:
          description: Forecast report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastReport'

  /budgets:
    get:
      operationId: listBudgets
      summary: List budgets with current-period progress
      responses:
        200:
          description: Budgets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetListResponse'
    post:
      operationId: createBudget
      summary: Create a budget for an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        201:
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        400:
          $ref: '#/components/responses/BadRequest'

  /budgets/{id}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
    patch:
      operationId: updateBudget
      summary: Update a budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
      responses:
        200:
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBudget
      summary: Delete a budget
      responses:
        204:
          description: Budget deleted
        404:
          $ref: '#/components/responses/NotFound'

  /scheduled-transactions:
    get:
      operationId: listScheduledTransactions
      summary: List scheduled (recurring) transactions
      responses:
        200:
          description: Scheduled transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransactionListResponse'
    post:
      operationId: createScheduledTransaction
      summary: Create a scheduled (recurring) transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTransactionRequest'
      responses:
        201:
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransaction'
        400:
          $ref: '#/components/responses/BadRequest'

  /scheduled-transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduledTransactionId'
    get:
      operationId: getScheduledTransaction
      summary: Get a scheduled transaction
      responses:
        200:
          description: Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransaction'
        404:
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateScheduledTransaction
      summary: Update a scheduled transaction (full template + recurrence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledTransactionRequest'
      responses:
        200:
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTransaction'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteScheduledTransaction
      summary: Delete a scheduled transaction
      responses:
        204:
          description: Schedule deleted
        404:
          $ref: '#/components/responses/NotFound'

  /category-rules:
    get:
      operationId: listCategoryRules
      summary: List merchant → category ingest routing rules
      responses:
        200:
          description: Rules list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRuleListResponse'
    post:
      operationId: createCategoryRule
      summary: Create a merchant → category routing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRuleRequest'
      responses:
        201:
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRule'
        400:
          $ref: '#/components/responses/BadRequest'

  /category-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryRuleId'
    patch:
      operationId: updateCategoryRule
      summary: Update a routing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRuleRequest'
      responses:
        200:
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRule'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategoryRule
      summary: Delete a routing rule
      responses:
        204:
          description: Rule deleted
        404:
          $ref: '#/components/responses/NotFound'

  /push/vapid-public-key:
    get:
      operationId: getPushPublicKey
      summary: VAPID public key the browser uses to subscribe to push (empty when push is disabled)
      responses:
        200:
          description: Public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushPublicKeyResponse'

  /push/subscriptions:
    post:
      operationId: subscribePush
      summary: Register a Web Push subscription for the current device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
      responses:
        204:
          description: Subscription stored
        400:
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: unsubscribePush
      summary: Remove a Web Push subscription by endpoint
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string }
      responses:
        204:
          description: Subscription removed
        400:
          $ref: '#/components/responses/BadRequest'

  /receipts:
    get:
      operationId: listReceipts
      summary: List receipt headers (no items), newest first
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        200:
          description: Receipts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptListResponse'
    post:
      operationId: createReceipt
      summary: Upload a fiscal QR url + receipt photo; scrape and parse asynchronously
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - qr_url
                - photo
              properties:
                qr_url:
                  type: string
                  description: Full ofd.soliq.uz check URL from the receipt QR code.
                photo:
                  type: string
                  format: binary
                  description: JPEG image of the paper receipt.
      responses:
        201:
          description: Receipt accepted; processing in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptCreated'
        400:
          $ref: '#/components/responses/BadRequest'

  /receipts/{id}:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      operationId: getReceipt
      summary: Get a receipt with its parsed items
      responses:
        200:
          description: Receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteReceipt
      summary: Delete a receipt and its stored photo
      responses:
        204:
          description: Deleted
        404:
          $ref: '#/components/responses/NotFound'

  /receipts/{id}/transaction:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    put:
      operationId: linkReceiptTransaction
      summary: Link the receipt to a transaction (one transaction per receipt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptLinkRequest'
      responses:
        200:
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: That transaction is already linked to another receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: unlinkReceiptTransaction
      summary: Remove the receipt's transaction link
      responses:
        200:
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        404:
          $ref: '#/components/responses/NotFound'

  /receipts/{id}/reparse:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    post:
      operationId: reparseReceipt
      summary: Re-run the parser over the receipt's stored HTML
      responses:
        200:
          description: Re-parsed receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    BudgetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduledTransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReceiptId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    IngestAuth:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    AppConfig:
      type: object
      additionalProperties: false
      required:
        - base_currency
        - note_required_above
      properties:
        base_currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        note_required_above:
          type: integer
          format: int64
          description: A note is required when a transaction amount exceeds this many minor units.

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: bad request

    PushPublicKeyResponse:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
          description: VAPID public key (base64url). Empty when push is disabled server-side.

    PushSubscriptionRequest:
      type: object
      additionalProperties: false
      description: Mirrors the browser PushSubscription.toJSON() shape.
      required:
        - endpoint
        - keys
      properties:
        endpoint:
          type: string
        keys:
          type: object
          additionalProperties: false
          required:
            - p256dh
            - auth
          properties:
            p256dh:
              type: string
            auth:
              type: string

    AccountListResponse:
      type: object
      additionalProperties: false
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - type
        - currency
        - opening_balance
        - balance
        - archived
        - include_in_net_worth
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: './definitions.yaml#/components/schemas/AccountKind'
        type:
          $ref: './definitions.yaml#/components/schemas/AccountType'
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        opening_balance:
          $ref: './definitions.yaml#/components/schemas/Money'
        balance:
          $ref: './definitions.yaml#/components/schemas/Money'
        archived:
          type: boolean
        include_in_net_worth:
          type: boolean
          description: When false, the account is excluded from net-worth totals and currency exposure.
        created_at:
          type: string
          format: date-time
        card_last4:
          type: string
          nullable: true
          description: Card identifier used to route external ingest to this account.
        # subtype fields, present only for the relevant type
        interest_rate:
          type: number
          nullable: true
        term_months:
          type: integer
          nullable: true
        maturity_date:
          type: string
          format: date
          nullable: true
        capitalization:
          type: boolean
          nullable: true
        credit_limit:
          $ref: './definitions.yaml#/components/schemas/Money'
        principal:
          $ref: './definitions.yaml#/components/schemas/Money'
        start_date:
          type: string
          format: date
          nullable: true
        payment_day:
          type: integer
          nullable: true

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
        - type
        - currency
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: './definitions.yaml#/components/schemas/AccountKind'
        type:
          $ref: './definitions.yaml#/components/schemas/AccountType'
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        opening_balance:
          type: integer
          format: int64
          default: 0
        include_in_net_worth:
          type: boolean
          default: true
        interest_rate:
          type: number
        term_months:
          type: integer
        maturity_date:
          type: string
          format: date
        capitalization:
          type: boolean
        credit_limit:
          type: integer
          format: int64
        principal:
          type: integer
          format: int64
        start_date:
          type: string
          format: date
        payment_day:
          type: integer
        card_last4:
          type: string

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        archived:
          type: boolean
        include_in_net_worth:
          type: boolean
        interest_rate:
          type: number
        term_months:
          type: integer
        maturity_date:
          type: string
          format: date
        capitalization:
          type: boolean
        credit_limit:
          type: integer
          format: int64
        principal:
          type: integer
          format: int64
        start_date:
          type: string
          format: date
        payment_day:
          type: integer
        card_last4:
          type: string

    CategoryListResponse:
      type: object
      additionalProperties: false
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - archived
        - hidden_in_picker
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: './definitions.yaml#/components/schemas/CategoryType'
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        archived:
          type: boolean
        hidden_in_picker:
          type: boolean
          description: When true, the category is hidden from the categorize picker.
        created_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: './definitions.yaml#/components/schemas/CategoryType'
        parent_id:
          type: string
          format: uuid
        icon:
          type: string
        color:
          type: string
        hidden_in_picker:
          type: boolean

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        icon:
          type: string
        color:
          type: string
        archived:
          type: boolean
        hidden_in_picker:
          type: boolean

    CategoryRule:
      type: object
      additionalProperties: false
      required:
        - id
        - pattern
        - category_id
        - category_name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
          description: Case-insensitive merchant substring that routes ingest to the category.
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        created_at:
          type: string
          format: date-time

    CategoryRuleListResponse:
      type: object
      additionalProperties: false
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRule'

    CreateCategoryRuleRequest:
      type: object
      additionalProperties: false
      required:
        - pattern
        - category_id
      properties:
        pattern:
          type: string
          minLength: 1
        category_id:
          type: string
          format: uuid

    UpdateCategoryRuleRequest:
      type: object
      additionalProperties: false
      properties:
        pattern:
          type: string
          minLength: 1
        category_id:
          type: string
          format: uuid

    SuggestIconsRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: './definitions.yaml#/components/schemas/CategoryType'

    SuggestIconsResponse:
      type: object
      additionalProperties: false
      required:
        - icons
      properties:
        icons:
          type: array
          description: Tabler icon names in kebab-case (e.g. "shopping-cart"), most relevant first.
          items:
            type: string

    TransactionListResponse:
      type: object
      additionalProperties: false
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - date
        - type
        - amount
        - tags
        - created_at
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        type:
          $ref: './definitions.yaml#/components/schemas/TransactionType'
        from_account_id:
          type: string
          format: uuid
          nullable: true
        to_account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        to_amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        rate_to_base:
          type: string
          nullable: true
          description: Frozen FX rate at transaction time; present when currency != base.
        base_amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        note:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        external_id:
          type: string
          nullable: true
          description: Stable idempotency key for externally-ingested transactions.
        transfer_group_id:
          type: string
          nullable: true
        split_group_id:
          type: string
          nullable: true
          description: Ties a split expense to its per-person receivable transfer legs.
        receipt_id:
          type: string
          format: uuid
          nullable: true
          description: The scanned fiscal receipt linked to this transaction, if any.

    SplitParticipantInput:
      type: object
      additionalProperties: false
      required:
        - name
        - amount
      properties:
        name:
          type: string
          minLength: 1
          description: The person who owes you this share.
        amount:
          type: integer
          format: int64
          description: This person's share, in the paying account's currency (minor units).

    SetSplitRequest:
      type: object
      additionalProperties: false
      required:
        - my_share
        - participants
      properties:
        my_share:
          type: integer
          format: int64
          description: Your own share; becomes the expense amount. Plus the sum of participants it must equal the original bill.
        participants:
          type: array
          description: One entry per friend. Empty un-splits the expense.
          items:
            $ref: '#/components/schemas/SplitParticipantInput'

    SplitParticipant:
      type: object
      required:
        - account_id
        - name
        - amount
        - owed
      properties:
        account_id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          $ref: './definitions.yaml#/components/schemas/Money'
        owed:
          $ref: './definitions.yaml#/components/schemas/Money'

    TransactionSplit:
      type: object
      required:
        - my_share
        - participants
      properties:
        split_group_id:
          type: string
          nullable: true
        my_share:
          $ref: './definitions.yaml#/components/schemas/Money'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/SplitParticipant'

    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
      properties:
        date:
          type: string
          format: date-time
          description: Defaults to now when omitted.
        type:
          $ref: './definitions.yaml#/components/schemas/TransactionType'
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Minor units, in the primary account's currency.
        to_amount:
          type: integer
          format: int64
          description: Required for cross-currency transfers; in the to account's currency.
        rate_to_base:
          type: string
          description: Required when the primary currency differs from base. Decimal string.
        note:
          type: string
        tags:
          type: array
          items:
            type: string

    IngestTransactionRequest:
      type: object
      additionalProperties: false
      description: |
        External transaction (e.g. bank notification). The app owns routing: it
        resolves cards to accounts and the merchant to a category. The caller
        sends the card(s) and merchant, not account/category ids.
      required:
        - external_id
        - type
        - amount
      properties:
        external_id:
          type: string
          minLength: 1
          description: Stable idempotency key (e.g. tg:<chat>:<msg> or tg:transfer:<lo>-<hi>).
        transfer_group_id:
          type: string
        date:
          type: string
          format: date-time
        type:
          $ref: './definitions.yaml#/components/schemas/TransactionType'
        from_card_last4:
          type: string
          description: Card whose account money leaves (expense, transfer). Resolved app-side.
        to_card_last4:
          type: string
          description: Card whose account money enters (income, transfer). Resolved app-side.
        merchant:
          type: string
          description: Raw merchant/source text; used to route to a category and stored as the note.
        amount:
          type: integer
          format: int64
        to_amount:
          type: integer
          format: int64
        rate_to_base:
          type: string
        tags:
          type: array
          items:
            type: string

    PatchTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - category_id
      properties:
        category_id:
          type: string
          format: uuid
          description: New category; its type must match the transaction's type.

    CategorySuggestion:
      type: object
      additionalProperties: false
      required:
        - category_id
        - category_name
        - source
      properties:
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        source:
          $ref: './definitions.yaml#/components/schemas/SuggestionSource'

    CategorySuggestionsResponse:
      type: object
      additionalProperties: false
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/CategorySuggestion'

    CategoryRuleBlock:
      type: object
      additionalProperties: false
      required:
        - merchant
        - created_at
      properties:
        merchant:
          type: string
        created_at:
          type: string
          format: date-time

    CategoryRuleBlockListResponse:
      type: object
      additionalProperties: false
      required:
        - blocks
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRuleBlock'

    CreateCategoryRuleBlockRequest:
      type: object
      additionalProperties: false
      required:
        - merchant
      properties:
        merchant:
          type: string
          minLength: 1

    NetWorthReport:
      type: object
      additionalProperties: false
      required:
        - base
        - net_worth
        - assets
        - liabilities
        - by_currency
        - missing_rates
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        net_worth:
          $ref: './definitions.yaml#/components/schemas/Money'
        assets:
          $ref: './definitions.yaml#/components/schemas/Money'
        liabilities:
          $ref: './definitions.yaml#/components/schemas/Money'
        by_currency:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyExposure'
        missing_rates:
          type: array
          description: Currencies with no known rate, excluded from the base totals.
          items:
            $ref: './definitions.yaml#/components/schemas/Currency'

    CurrencyExposure:
      type: object
      additionalProperties: false
      required:
        - currency
        - assets
        - liabilities
        - net
        - rate_known
      properties:
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'
        assets:
          $ref: './definitions.yaml#/components/schemas/Money'
        liabilities:
          $ref: './definitions.yaml#/components/schemas/Money'
        net:
          $ref: './definitions.yaml#/components/schemas/Money'
        rate_known:
          type: boolean
        net_in_base:
          $ref: './definitions.yaml#/components/schemas/Money'

    BalanceSnapshotRequest:
      type: object
      additionalProperties: false
      description: |
        A snapshot of reported card balances (e.g. the bot's periodic report).
        Each entry is upserted by card_last4; the latest snapshot wins.
      required:
        - reported_at
        - balances
      properties:
        reported_at:
          type: string
          format: date-time
        source:
          type: string
          description: Origin label (e.g. "humo").
        balances:
          type: array
          items:
            $ref: '#/components/schemas/BalanceSnapshotEntry'

    BalanceSnapshotEntry:
      type: object
      additionalProperties: false
      required:
        - card_last4
        - amount
        - currency
      properties:
        card_last4:
          type: string
          minLength: 1
          description: Card identifier used to route to an account.
        bank:
          type: string
          description: Display label for the issuing bank (e.g. "TBCBANK").
        amount:
          type: integer
          format: int64
          description: Reported balance in minor units.
        currency:
          $ref: './definitions.yaml#/components/schemas/Currency'

    ReconciliationReport:
      type: object
      additionalProperties: false
      required:
        - base
        - rows
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationRow'

    ReconciliationRow:
      type: object
      additionalProperties: false
      required:
        - card_last4
        - account_id
        - account_name
        - reported
        - derived
        - in_sync
        - currency_mismatch
        - reported_at
      properties:
        card_last4:
          type: string
        bank:
          type: string
          nullable: true
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        reported:
          $ref: './definitions.yaml#/components/schemas/Money'
        derived:
          $ref: './definitions.yaml#/components/schemas/Money'
        delta:
          $ref: './definitions.yaml#/components/schemas/Money'
        in_sync:
          type: boolean
        currency_mismatch:
          type: boolean
          description: Reported currency differs from the account currency.
        reported_at:
          type: string
          format: date-time

    SpendingReport:
      type: object
      additionalProperties: false
      required:
        - base
        - total
        - categories
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        total:
          $ref: './definitions.yaml#/components/schemas/Money'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySpend'

    CategorySpend:
      type: object
      additionalProperties: false
      required:
        - category_id
        - category_name
        - amount
      properties:
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        amount:
          $ref: './definitions.yaml#/components/schemas/Money'

    CashFlowReport:
      type: object
      additionalProperties: false
      required:
        - base
        - months
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthFlow'

    MonthFlow:
      type: object
      additionalProperties: false
      required:
        - month
        - income
        - expense
        - net
      properties:
        month:
          type: string
          description: YYYY-MM
        income:
          $ref: './definitions.yaml#/components/schemas/Money'
        expense:
          $ref: './definitions.yaml#/components/schemas/Money'
        net:
          $ref: './definitions.yaml#/components/schemas/Money'

    ForecastReport:
      type: object
      additionalProperties: false
      description: Projected cash flow for a month from scheduled transactions, budgets and credit-card usage. Expense is total planned outflow (expenses, transfers, budgets and card usage combined); net = income − expense.
      required:
        - base
        - month
        - income
        - expense
        - net
        - lines
        - budget_lines
        - credit_card_lines
        - missing_rates
      properties:
        base:
          $ref: './definitions.yaml#/components/schemas/Currency'
        month:
          type: string
          description: YYYY-MM
        income:
          $ref: './definitions.yaml#/components/schemas/Money'
        expense:
          $ref: './definitions.yaml#/components/schemas/Money'
        net:
          $ref: './definitions.yaml#/components/schemas/Money'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ForecastLine'
        budget_lines:
          type: array
          description: Budget limits normalized to a monthly equivalent; also summed into expense.
          items:
            $ref: '#/components/schemas/ForecastBudgetLine'
        credit_card_lines:
          type: array
          description: Per credit-card spend charged this month (paid later); also summed into expense.
          items:
            $ref: '#/components/schemas/ForecastCreditCardLine'
        missing_rates:
          type: array
          description: Currencies with no known rate; their schedules are omitted from totals.
          items:
            type: string

    ForecastLine:
      type: object
      additionalProperties: false
      required:
