components:
  schemas:
    Currency:
      type: string
      description: ISO 4217 currency code.
      pattern: "^[A-Z]{3}$"
      example: UZS
    Money:
      type: object
      description: Monetary value as integer minor units plus an ISO-4217 currency code.
      x-go-type: money.Money
      x-go-type-import:
        name: money
        path: finance/pkg/money
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in minor units (e.g. cents). Never floating point.
          example: 100000
        currency:
          $ref: '#/components/schemas/Currency'
    AccountKind:
      type: string
      enum: [asset, liability]
    AccountType:
      type: string
      enum: [cash, debit_card, deposit, credit_card, loan, receivable]
    CategoryType:
      type: string
      enum: [expense, income]
    TransactionType:
      type: string
      enum: [expense, income, transfer]
    SuggestionSource:
      type: string
      description: Where a category suggestion came from.
      enum: [rule, ai]
    BudgetPeriod:
      type: string
      enum: [weekly, monthly, yearly]
    ScheduleFrequency:
      type: string
      description: How often a scheduled transaction recurs (combined with an interval). "once" is a one-time item on its start date.
      enum: [once, daily, weekly, monthly, yearly]
    ReceiptStatus:
      type: string
      description: Lifecycle of an async receipt scrape+parse.
      enum: [pending, html_received, success, failed]
